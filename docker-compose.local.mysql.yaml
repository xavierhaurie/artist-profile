services:
  mysql:
    image: mysql:8.4
    container_name: artist-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: artistprofile
      MYSQL_USER: artist
      MYSQL_PASSWORD: artistpass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
    driver: local